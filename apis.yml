aid: speedata
name: Speedata
description: >-
  Speedata is a Tel Aviv-based semiconductor company that builds the APU (Analytics Processing Unit),
  a processor purpose-built for accelerating Apache Spark SQL, batch ETL and AI data-preparation
  workloads rather than graphics or model training. The APU ships as the C200 PCIe Gen5 accelerator
  card powered by the company's Callisto ASIC, paired with a software layer called Dash that plugs
  into the Spark Catalyst optimizer and offloads compute-intensive stages to the card with no
  application code changes. Founded in 2019 by researchers in multi-threaded coarse-grained
  reconfigurable architecture, the company raised a $44M Series B in June 2025 (total funding ~$114M)
  from Walden Catalyst Ventures, 83North and Koch Disruptive. Speedata publishes no public web API,
  developer portal or machine-readable API contract; its programmatic surface is a Spark plugin JAR
  distributed under an early-access program, plus a free browser/CLI Workload Analyzer for estimating
  acceleration on a customer's own Spark workloads.
