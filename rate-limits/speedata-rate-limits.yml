  An honest zero. Speedata publishes no web API, so there is no rate limit to document
  and no rate-limit response header to record. The only live HTTP surface on the domain
  that behaves like an API is the platform-authored Wix Site MCP endpoint at
  https://www.speedata.io/_api/mcp; its tools/list response carried no RateLimit-*,
  X-RateLimit-* or Retry-After header, and Wix documents no limit for it on Speedata's
  behalf. Where the product does have a throughput ceiling it is a hardware property of
  the C200 card ("over a billion rows per second", spark.speedata.apus=1 selecting the
  number of APUs), not an API quota — recorded in the packages and conformance artifacts
