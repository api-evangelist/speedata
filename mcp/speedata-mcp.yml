tools:
- name: GetBusinessDetails
  category: site-metadata
  description: Business and site details — timezone, email, phone, fax, address, site name, business schedule.
- name: SearchInSite
  category: site-content
  description: Free-text search across public site content.
- name: SearchSiteApiDocs
  category: docs
  description: Searches Wix business-solution API documentation applicable to this site.
- name: GenerateVisitorToken
  category: auth
  description: Creates an anonymous visitor session token, required before CallWixSiteAPI / ExecuteWixAPI.
- name: CallWixSiteAPI
  category: platform-api
  description: Single HTTP call against a wixapis.com endpoint on the visitor's behalf.
- name: ExecuteWixAPI
  category: platform-api
  description: Runs a sandboxed JavaScript function that chains wixapis.com calls on the visitor's behalf.
- name: BrowseWixRESTDocsMenu
  category: docs
  description: Navigates the Wix REST API documentation menu hierarchy.
- name: ReadFullDocsArticle
  category: docs
  description: Fetches a full Wix docs or method article, including code examples.
- name: ReadFullDocsMethodSchema
  category: docs
  description: Fetches the full request/response schema for a Wix API method.
coverage_note: No Speedata-authored MCP server exists. There is no OpenAPI, GraphQL SDL or other contract
